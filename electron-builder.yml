appId: no.dnd.characterforge
productName: D&D Character Forge
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.png
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName} Setup ${version}.${ext}
portable:
  artifactName: ${productName} ${version} Portable.${ext}
