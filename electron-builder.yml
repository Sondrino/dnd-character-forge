appId: no.dnd.characterforge
productName: D&D Character Forge
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.png
# Slår av Electron-funksjoner som kan misbrukes (kjøre som Node, debug-flagg) og sjekker at app-filene ikke er endret
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: DnD-Character-Forge-Setup-${version}.${ext}
portable:
  artifactName: DnD-Character-Forge-${version}-Portable.${ext}
